name: outlet-marketplace

# All service env values fall back to safe local defaults, so `docker compose
# up --build` works even before `.env` is created. Copy `.env.example` to
# `.env` to override anything.

x-app-image: &app-image
  build:
    context: .
    dockerfile: infrastructure/docker/app.Dockerfile
  image: outlet-app:local

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  DATABASE_URL: ${DATABASE_URL:-postgresql://outlet:outlet@postgres:5432/outlet}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  STOREFRONT_URL: ${STOREFRONT_URL:-http://localhost:3000}
  ADMIN_URL: ${ADMIN_URL:-http://localhost:3001}
  API_URL: ${API_URL:-http://localhost:4000}
  STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_BUCKET: ${S3_BUCKET:-outlet-local}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minio}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minio123}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  EMAIL_FROM: ${EMAIL_FROM:-Outlet Marketplace <no-reply@outlet.local>}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
  MOCK_PAYMENT_WEBHOOK_SECRET: ${MOCK_PAYMENT_WEBHOOK_SECRET:-local-mock-webhook-secret}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  SESSION_SECRET: ${SESSION_SECRET:-local-dev-session-secret-change-me}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-outlet_session}
  CART_COOKIE_NAME: ${CART_COOKIE_NAME:-outlet_cart}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
  TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000,http://localhost:3001}
  CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-none}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  RESERVATION_DURATION_MINUTES: ${RESERVATION_DURATION_MINUTES:-20}
  DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-EUR}
  DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
  RESERVATION_SWEEP_INTERVAL_SECONDS: ${RESERVATION_SWEEP_INTERVAL_SECONDS:-30}
  CAMPAIGN_SWEEP_INTERVAL_SECONDS: ${CAMPAIGN_SWEEP_INTERVAL_SECONDS:-60}
  API_PORT: ${API_PORT:-4000}
  API_HOST: ${API_HOST:-0.0.0.0}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-300}
  AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-10}
  NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
  NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL:-http://localhost:3000}
  NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://localhost:3001}
  NEXT_PUBLIC_ASSET_BASE_URL: ${NEXT_PUBLIC_ASSET_BASE_URL:-http://localhost:9000}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: outlet
      POSTGRES_PASSWORD: outlet
      POSTGRES_DB: outlet
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U outlet -d outlet']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio123}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minio} ${S3_SECRET_KEY:-minio123} &&
      mc mb --ignore-existing local/${S3_BUCKET:-outlet-local} &&
      mc mb --ignore-existing local/outlet-test &&
      mc anonymous set download local/${S3_BUCKET:-outlet-local} &&
      mc anonymous set download local/outlet-test &&
      echo 'MinIO buckets ready'
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '8025:8025'
      - '1025:1025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *app-image
    environment:
      <<: *app-env
    command: sh -c "pnpm db:migrate && pnpm db:seed"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  api:
    <<: *app-image
    command: pnpm --filter @outlet/api start:dev
    environment:
      <<: *app-env
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  worker:
    <<: *app-image
    command: pnpm --filter @outlet/worker dev
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  storefront:
    <<: *app-image
    command: pnpm --filter @outlet/storefront dev
    environment:
      <<: *app-env
      # Server-side fetches from inside the container reach the API directly.
      API_INTERNAL_URL: http://api:4000
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy

  admin:
    <<: *app-image
    command: pnpm --filter @outlet/admin dev
    environment:
      <<: *app-env
      API_INTERNAL_URL: http://api:4000
    ports:
      - '3001:3001'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
