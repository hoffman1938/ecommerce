services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: outlet
      POSTGRES_PASSWORD: outlet
      POSTGRES_DB: outlet
    ports:
      - "5432:5432"
    volumes:
      # Creates the dedicated outlet_test database required by pnpm test:integration.
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outlet -d outlet"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio123 &&
      mc mb --ignore-existing local/outlet-local &&
      mc mb --ignore-existing local/outlet-test &&
      mc anonymous set download local/outlet-local &&
      mc anonymous set download local/outlet-test &&
      echo 'MinIO buckets ready'
      "
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
