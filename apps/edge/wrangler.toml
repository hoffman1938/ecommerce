# Cloudflare Worker: the demo/staging API.
#
# Everything here is a *name* or a *public* value. No account id, no API token,
# no secret. `database_id` and the KV `id` identify resources but grant nothing:
# reaching either needs a Cloudflare API token, which lives only in the shell
# of whoever deploys. They are committed because wrangler needs them to target
# the right resources, and because a deploy that works only on one machine is
# not a deploy — see infrastructure/cloudflare/d1-and-r2.md.
#
# A fork of this repository will point at these resources and be refused by
# Cloudflare, which is the intended outcome: create your own with
# `wrangler d1 create` and replace them.
#
# Secrets (SESSION_SECRET, SEED_ADMIN_PASSWORD, …) are never in this file.
# They are set with `wrangler secret put NAME` and read from `env` at runtime.

name = "outlet-demo-api"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

# --- Public configuration ----------------------------------------------------
# These reach the browser in responses anyway; none of them is a credential.
[vars]
ENVIRONMENT = "demo"
DEMO_MODE = "true"
# Comma-separated exact origins allowed to send credentialed requests.
# Overridden per environment; never widened to "*" (see SECURITY.md).
ALLOWED_ORIGINS = "http://localhost:3000,http://localhost:3001"
PUBLIC_MEDIA_BASE_URL = ""

# --- D1 ----------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "outlet-demo"
database_id = "516caddc-64f2-4f79-90a3-8db15e2a6375"
migrations_dir = "migrations"

# --- R2 ----------------------------------------------------------------------
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "outlet-demo-media"
preview_bucket_name = "outlet-demo-media"

# --- Rate limiting -----------------------------------------------------------
# A KV namespace is the free, Cloudflare-native place to keep the counters the
# login/checkout limiter reads. Create it with:
#   wrangler kv namespace create RATE_LIMIT
# and paste the id below. The limiter fails open if the binding is absent, so a
# fork without KV still runs — it just does not rate limit.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "d0a178f289bb45a5b4a185d9fc9d65b4"

# --- Scheduled work ----------------------------------------------------------
# Expiring stale inventory reservations. Cron triggers are free; this is the
# only background job the demo needs, which is why there is no Queue binding.
[triggers]
crons = ["*/5 * * * *"]

# --- Environments ------------------------------------------------------------

[env.production]
name = "outlet-demo-api"

[env.production.vars]
ENVIRONMENT = "demo"
DEMO_MODE = "true"
ALLOWED_ORIGINS = "https://ecommerce-135.pages.dev"
PUBLIC_MEDIA_BASE_URL = ""

[[env.production.d1_databases]]
binding = "DB"
database_name = "outlet-demo"
database_id = "516caddc-64f2-4f79-90a3-8db15e2a6375"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "MEDIA"
bucket_name = "outlet-demo-media"

[[env.production.kv_namespaces]]
binding = "RATE_LIMIT"
id = "d0a178f289bb45a5b4a185d9fc9d65b4"
