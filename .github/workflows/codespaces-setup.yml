name: Codespaces - prebuild

on:
  push:
    branches: [main]

# The default GITHUB_TOKEN is scoped down to reading the repository: no job
# here writes a commit, a release, a package or a comment.
permissions:
  contents: read

jobs:
  prebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack
        run: corepack enable
      - name: Install pnpm
        run: corepack prepare pnpm@latest --activate
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
